<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    
    <link rel="stylesheet" href="../../global/global.css">
    <script type="module" defer src="../..//global/global.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/nord.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<header>
    <a class="header-logo" href="../../index.html">MTG</a>
    <a class="header-button" href="../about/index.html">About</a>
    <a class="header-button" href="../projects/index.html">Projects</a>
    <a class="header-button" href="../guides/index.html">Guides</a>
</header>

<main>
    <h1>Projects</h1>
    <h2>Projects by MTG or its Members</h2>

    <p>Sort by:</p>
    <select id="sort-source">
        <option value="date" selected>Date</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
    </select>
    <select id="sort-ascending">
        <option value="true">Ascending</option>
        <option value="false" selected>Descending</option>
    </select>

    <ul id="json-list"></ul>
    <script type="module">
        import { loadList, sortList } from "../../global/lists.js";
        loadList("./index.json", "repository", true);
        document.getElementById("sort-source").addEventListener("change", sortList);
        document.getElementById("sort-ascending").addEventListener("change", sortList);
    </script>
</main>

<footer></footer>

</body>
</html>
